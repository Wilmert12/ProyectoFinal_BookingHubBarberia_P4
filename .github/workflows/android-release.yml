name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Firmar y publicar APK/AAB
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Aceptar licencias e instalar SDK Android 17 Preview
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager --channel=3 "platforms;android-37.0"

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validar y convertir la etiqueta a versión Android
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "La etiqueta debe usar el formato vMAJOR.MINOR.PATCH (ejemplo: v1.2.3)." >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( minor > 999 || patch > 999 )); then
            echo "MINOR y PATCH deben estar entre 0 y 999 para conservar versionCode único." >&2
            exit 1
          fi
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "La etiqueta produce un versionCode fuera del rango de Android." >&2
            exit 1
          fi
          echo "name=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "code=${version_code}" >> "$GITHUB_OUTPUT"

      - name: Validar secretos y preparar keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Falta el secreto ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Falta el secreto ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Falta el secreto ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Falta el secreto ANDROID_KEY_PASSWORD}"
          keystore="$RUNNER_TEMP/cerquillo-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Construir release firmado
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./src/BookingHub.Android/gradlew
          -p src/BookingHub.Android
          --no-daemon
          -PbookinghubRequireReleaseSigning=true
          -PbookinghubVersionName=${{ steps.version.outputs.name }}
          -PbookinghubVersionCode=${{ steps.version.outputs.code }}
          :app:assembleRelease
          :app:bundleRelease
          -x lintVitalRelease
          -x lintVitalAnalyzeRelease

      - name: Verificar firmas y artefactos
        working-directory: src/BookingHub.Android
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          bundle="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$bundle"
          apksigner_path="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose "$apk"
          jarsigner -verify "$bundle" >/dev/null

      - name: Publicar release de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: src/BookingHub.Android
        run: >-
          gh release create "${{ github.ref_name }}"
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/bundle/release/app-release.aab
          --title "${{ github.ref_name }}"
          --generate-notes
