name: Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/BookingHub.Android/**"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release.yml"
  push:
    branches: [main]
    paths:
      - "src/BookingHub.Android/**"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, JVM, cobertura y empaquetado
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v6

      - name: Preparar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Aceptar licencias e instalar SDK Android 17 Preview
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager --channel=3 "platforms;android-37.0"

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validar Android
        run: >-
          bash ./src/BookingHub.Android/gradlew
          -p src/BookingHub.Android
          --no-daemon
          :app:lintDebug
          :app:testDebugUnitTest
          :app:jacocoDebugUnitTestReport
          :app:jacocoCoreCoverageVerification
          :app:compileDebugAndroidTestKotlin
          :app:assembleDebug
          :app:assembleRelease
          :app:bundleRelease
          -x lintVitalRelease
          -x lintVitalAnalyzeRelease

      - name: Guardar reportes y artefactos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-${{ github.sha }}
          if-no-files-found: warn
          path: |
            src/BookingHub.Android/app/build/reports/lint-results-debug.html
            src/BookingHub.Android/app/build/reports/jacoco/jacocoDebugUnitTestReport/html/**
            src/BookingHub.Android/app/build/test-results/testDebugUnitTest/**
            src/BookingHub.Android/app/build/outputs/apk/debug/*.apk
            src/BookingHub.Android/app/build/outputs/apk/release/*.apk
            src/BookingHub.Android/app/build/outputs/bundle/release/*.aab

  instrumented:
    name: Pruebas Compose en emulador API 36
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v6

      - name: Preparar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Aceptar licencias e instalar SDK Android 17 Preview
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager --channel=3 "platforms;android-37.0"

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ejecutar pruebas instrumentadas
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1200
          disable-animations: true
          script: >-
            bash ./src/BookingHub.Android/gradlew
            -p src/BookingHub.Android
            --no-daemon
            :app:connectedDebugAndroidTest
